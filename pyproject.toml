[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seenit"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "discord.py",
    "aiosqlite",
    "aiohttp",
    "Pillow",
    "ImageHash",
    "python-dotenv",
    "curl_cffi",
]

[tool.setuptools.packages.find]
where = ["src"]